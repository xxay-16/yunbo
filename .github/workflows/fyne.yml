name: Build Fyne preview
on:
  push:
    branches: [feat/fyne-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fyne-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Enable C compiler on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $compiler = @('C:\msys64\mingw64\bin','C:\mingw64\bin') | Where-Object { Test-Path (Join-Path $_ 'gcc.exe') } | Select-Object -First 1
            if (-not $compiler) { throw 'MinGW GCC not found on runner' }
            $compiler | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - name: Test and vet
        shell: bash
        run: |
          go test -race ./...
          go vet ./...
      - name: Build Windows native app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath build/bin/yunbo-fyne.exe -DestinationPath dist/yunbo-fyne-windows-amd64.zip
      - name: Build macOS Universal DMG
        if: runner.os == 'macOS'
        run: bash scripts/build-fyne-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yunbo-fyne-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
